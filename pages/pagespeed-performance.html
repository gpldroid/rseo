<!DOCTYPE html>
<html lang="en" class="light">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PageSpeed Performance | Fastseo</title><meta name="description" content="Measure website PageSpeed and Lighthouse performance with Fastseo."><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={darkMode:'class',theme:{extend:{colors:{brand:{500:'#1a73e8',600:'#1557b0',darkBg:'#0f172a',darkCard:'#1e293b',darkBorder:'#334155'}},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}};</script><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="../assets/css/consent.css">
</head>
<body class="bg-gray-50 dark:bg-brand-darkBg text-slate-800 dark:text-slate-100 min-h-screen"><header class="sticky top-0 z-50 bg-white/90 dark:bg-brand-darkCard/90 backdrop-blur-md border-b border-gray-200 dark:border-brand-darkBorder"><div class="h-1 bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-500"></div><div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between"><a href="../" class="font-extrabold text-lg">⚡ Fastseo <span class="text-xs font-semibold text-brand-500">Performance</span></a><a href="../" class="text-sm font-bold text-brand-500">← Home</a></div></header>
<main class="max-w-5xl mx-auto px-4 sm:px-6 py-10"><section class="bg-white dark:bg-brand-darkCard rounded-3xl p-8 border border-gray-200 dark:border-brand-darkBorder shadow-sm mb-8"><span class="text-xs font-bold uppercase tracking-wider text-brand-500">Speed Analysis</span><h1 class="text-3xl sm:text-4xl font-black mt-3">PageSpeed Performance</h1><p class="text-gray-500 dark:text-gray-400 mt-3 max-w-2xl">Run a Lighthouse performance audit for mobile or desktop and inspect the most important loading metrics.</p></section>
<section class="bg-white dark:bg-brand-darkCard rounded-2xl border border-gray-200 dark:border-brand-darkBorder p-6 shadow-sm"><form id="f" class="grid md:grid-cols-[1fr_auto_auto] gap-3"><input id="u" type="url" required value="https://example.com" class="px-4 py-3.5 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800 outline-none focus:ring-2 focus:ring-brand-500"><select id="s" class="px-4 py-3.5 rounded-xl bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-800"><option value="mobile">Mobile</option><option value="desktop">Desktop</option></select><button class="px-7 py-3.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-bold">Run Test</button></form><div id="st" class="mt-5 text-sm text-gray-500">Ready for a PageSpeed test.</div><div id="out" class="hidden mt-6 grid sm:grid-cols-2 lg:grid-cols-4 gap-4"></div></section></main>
<script>f.addEventListener('submit',async e=>{e.preventDefault();st.textContent='Running Lighthouse audit…';out.classList.add('hidden');try{let r=await fetch('https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url='+encodeURIComponent(u.value)+'&strategy='+s.value);let d=await r.json(),lh=d.lighthouseResult||{},score=Math.round((lh.categories?.performance?.score||0)*100),a=lh.audits||{};let x=[['Performance',score+'/100'],['FCP',a['first-contentful-paint']?.displayValue||'N/A'],['LCP',a['largest-contentful-paint']?.displayValue||'N/A'],['TBT',a['total-blocking-time']?.displayValue||'N/A']];out.innerHTML=x.map(i=>`<div class="p-5 rounded-xl border border-gray-200 dark:border-gray-700"><div class="text-xs text-gray-500">${i[0]}</div><div class="text-2xl font-black mt-1">${i[1]}</div></div>`).join('');out.classList.remove('hidden');st.textContent='Performance audit completed.'}catch(e){st.textContent='Unable to retrieve PageSpeed data. Please try again.'}});</script><script src="../assets/js/consent.js"></script>
</body></html>
