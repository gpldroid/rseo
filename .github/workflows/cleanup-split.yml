name: Cleanup Split
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stray token
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          h=p.read_text(encoding='utf-8')
          h2=h.replace('const<script src="assets/js/script.js"></script>', '<script src="assets/js/script.js"></script>')
          if h2 == h:
              raise SystemExit('EXPECTED_TOKEN_NOT_FOUND')
          p.write_text(h2, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          rm -f .github/workflows/cleanup-split.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/cleanup-split.yml
          git commit -m 'Fix asset script tag placement'
          git push
