name: Build Tailwind CSS

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "assets/js/**/*.js"
      - "tailwind.config.js"
      - "assets/css/tailwind.input.css"
      - ".github/workflows/build-tailwind.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-tailwind
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production Tailwind CSS
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.js -i ./assets/css/tailwind.input.css -o ./assets/css/tailwind.css --minify

      - name: Commit generated CSS
        run: |
          if git diff --quiet -- assets/css/tailwind.css && test -z "$(git status --porcelain -- assets/css/tailwind.css)"; then
            echo "Tailwind CSS is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/tailwind.css
          git commit -m "build: generate optimized Tailwind CSS"
          git push
